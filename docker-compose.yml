# One command to run everything:  docker compose up --build
#   App:  http://localhost:8080
#   API:  http://localhost:3001/api   (also reachable through the app at /api)
services:
  api:
    build: ./backend
    environment:
      PORT: "3001"
      DATA_FILE: /data/db.json
      # Loads the sample movies and cinemas from the brief, only when the database is empty.
      # Set to "false" to start with no data.
      SEED_DEMO: "true"
    volumes:
      - doomsday-data:/data
    ports:
      - "3001:3001"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  doomsday-data:
